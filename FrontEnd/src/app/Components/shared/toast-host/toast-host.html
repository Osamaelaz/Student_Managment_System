@if (toast.toasts().length > 0) {
  <div class="toast-stack" aria-live="polite" aria-atomic="true">
    @for (item of toast.toasts(); track item.id) {
      <div class="toast-card {{ item.type }} dashboard-stagger">
        <div class="d-flex justify-content-between align-items-start gap-2">
          <div>
            <div class="fw-semibold d-flex align-items-center gap-2">
              <i class="bi" [ngClass]="iconFor(item.type)"></i>
              {{ item.title }}
            </div>
            <div class="small text-muted mt-1">{{ item.message }}</div>
          </div>
          <button type="button" class="btn-close" aria-label="Close" (click)="toast.dismiss(item.id)"></button>
        </div>
      </div>
    }
  </div>
}
