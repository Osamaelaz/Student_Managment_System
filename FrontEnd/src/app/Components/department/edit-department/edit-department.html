<div class="mx-auto my-4" style="max-width: 860px;">
  <div class="form-shell">
    <h2 class="section-title mb-1">Edit Department</h2>
    <p class="section-subtitle mb-3">Refine department details and keep structure updated.</p>

    @if (errorMessage()) {
      <div class="alert alert-danger">{{ errorMessage() }}</div>
    }

    <form #deptForm="ngForm" (ngSubmit)="updateDepartment()">
      <div class="mb-3">
        <label class="form-label" for="deptName">Department Name</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="department.Dept_Name"
          name="deptName"
          id="deptName"
          required
          minlength="2"
          #deptNameModel="ngModel"
          [class.is-invalid]="deptNameModel.invalid && deptNameModel.touched"
        />
        <div [hidden]="deptNameModel.valid || deptNameModel.untouched" class="text-danger">
          @if (deptNameModel.errors?.['required']) { <small class="d-block">Department name is required</small> }
          @if (deptNameModel.errors?.['minlength']) { <small class="d-block">Minimum length 2 characters</small> }
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="deptDesc">Description</label>
        <textarea class="form-control" [(ngModel)]="department.Dept_Desc" name="deptDesc" id="deptDesc"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label" for="deptLocation">Location</label>
        <input type="text" class="form-control" [(ngModel)]="department.Dept_Location" name="deptLocation" id="deptLocation" />
      </div>

      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-warning btn-icon" type="submit" [disabled]="isLoading() || deptForm.invalid">
          @if (!isLoading()) {
            <i class="bi bi-save"></i>
            Save Changes
          } @else {
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            Updating...
          }
        </button>

        <button type="button" class="btn btn-secondary btn-icon" [routerLink]="['/Departments']">
          <i class="bi bi-arrow-left"></i>
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
