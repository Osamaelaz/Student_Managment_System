<div class="surface-card p-3 p-lg-4 my-3">
  @if (isLoading()) {
    <div class="page-loader">
      <div class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></div>
      Loading department...
    </div>
  } @else if (isError()) {
    <div class="alert alert-danger">Unable to load department information.</div>
    <button class="btn btn-outline-primary btn-icon" (click)="backToDepartments()">
      <i class="bi bi-arrow-left"></i>
      Back to Departments
    </button>
  } @else {
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h2 class="section-title mb-1">Manage Courses</h2>
        <p class="section-subtitle mb-0">Department: {{ deptName() }}</p>
      </div>
      <button class="btn btn-outline-secondary btn-icon" (click)="backToDepartments()">
        <i class="bi bi-arrow-left"></i>
        Back
      </button>
    </div>

    <app-department-course-assign
      [deptId]="deptId()"
      [deptName]="deptName()"
      [startOpen]="true"
      [showToggle]="false"
    ></app-department-course-assign>
  }
</div>
